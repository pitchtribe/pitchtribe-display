name: Signage app + server

# `caldecote` is a club line, not a feature branch: it carries one club's build
# on top of the base system and is released separately (release-caldecote.yml).
# It is listed here because a long-lived branch with no tests is a branch that
# quietly stops working — see caldecote/README.md on that line.
on:
  push:
    branches: [main, caldecote]
    paths: ['app/**', 'signage-server/**', 'deploy/**', '.github/workflows/app.yml']
  pull_request:
    branches: [main, caldecote]
    paths: ['app/**', 'signage-server/**', 'deploy/**', '.github/workflows/app.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test signage package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test signage-server (sports engine)
        working-directory: signage-server
        run: npm test

      - name: Test app (with the engine embedded)
        run: npm test

      - name: Check deploy scripts
        # The job defaults to app/, and these paths are the repo's.
        working-directory: .
        # Every script, found rather than listed. A hand-written list is a list that
        # rots: the one this replaces named eight files, and the ninth script added to
        # deploy/ would have gone unchecked without anybody noticing. These run
        # unattended on somebody's Pi, which is the whole reason to check them.
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' f; do
            echo "bash -n $f"
            bash -n "$f"
            found=$((found + 1))
          done < <(find deploy image -name '*.sh' -print0 | sort -z)
          # A glob that matches nothing would turn this step into a no-op that passes.
          [[ "$found" -ge 9 ]] || { echo "only $found shell scripts found — expected at least 9"; exit 1; }
          echo "checked $found shell scripts"
          node --check app/lib/portal-hw.js
          node --check app/bin/backup.js
          node --check app/bin/remote-access.js
