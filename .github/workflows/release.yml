name: Release

# Publishes a PitchTribe release from main, with the SD card image attached:
# Actions → Release → Run workflow, enter the version (e.g. v0.2.0).
#
# This is the BASE SYSTEM's release, and only main's: it refuses anything that is
# not vX.Y.Z and it is what the website's download button points at. This is now
# the only release button there is — a club's screen ships as config on a base
# card, not as a build of its own.
#
# Tick "replace" to redo a release that went wrong — for example one whose tag
# points at the wrong commit. That deletes the existing release and its tag
# first, then tags main again. Without it, an existing version is refused.
#
# The tag is pushed with the workflow's own token, which doesn't trigger the
# tag-push build in image.yml, so this workflow runs that build itself.
#
# It publishes second. The release is created as a PRERELEASE, the image build
# attaches the assets over the next 10–15 minutes, and only then does a final job
# flip it to the latest release. /releases/latest — the download button on the
# site, the asset docs/setup.html names, the Imager repository in
# docs/troubleshooting.html — therefore never answers this version until there is
# something behind it, and a build that fails leaves a prerelease nobody is
# pointed at rather than an empty public download.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, like v0.2.0
        required: true
      replace:
        description: Replace this release if it already exists (deletes its tag and files, then tags main again)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag main and stage the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      REPLACE: ${{ inputs.replace }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check the version
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like v1.2.3, not “$VERSION”"; exit 1; }
          app_version="v$(node -p 'require("./app/package.json").version')"
          if [[ "$app_version" != "$VERSION" ]]; then
            echo "::warning::app/package.json says $app_version, but this release is $VERSION"
          fi

      - name: Remove the old release and tag
        run: |
          set -euo pipefail
          exists_release=0; exists_tag=0
          gh release view "$VERSION" >/dev/null 2>&1 && exists_release=1
          git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1 && exists_tag=1
          if (( exists_release || exists_tag )); then
            if [[ "$REPLACE" != true ]]; then
              echo "::error::$VERSION already exists. Run again with “replace” ticked to redo it from main."
              exit 1
            fi
            (( exists_release )) && gh release delete "$VERSION" --yes
            (( exists_tag )) && git push origin ":refs/tags/$VERSION"
            echo "Removed the old $VERSION"
          fi

      - name: Tag main and stage the release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The checkout fetched every tag, including any old copy of this one that
          # the previous step deleted on GitHub: drop it here too before re-tagging.
          git tag -d "$VERSION" >/dev/null 2>&1 || true
          git tag -a "$VERSION" -m "PitchTribe $VERSION" "$(git rev-parse HEAD)"
          git push origin "refs/tags/$VERSION"
          # --prerelease, so creating it does not move /releases/latest onto a
          # release with no image on it. The publish job below takes that off once
          # the image is attached; until then the site's download button still
          # answers the last version that has one.
          gh release create "$VERSION" --verify-tag --prerelease --title "PitchTribe $VERSION" --generate-notes
          echo "Tagged $(git rev-parse --short HEAD) as $VERSION — staged as a prerelease" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: SD card image
    needs: tag
    # A called workflow can only use what its caller grants it, and image.yml signs
    # the released image — so these three have to be listed here as well as there.
    # Granting fewer than it asks for does not warn or skip the signing: the whole
    # run fails before any job starts, with no log, no annotation and no clue —
    # which is how it was found, with a version number already typed in.
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      release_tag: ${{ inputs.version }}

  publish:
    name: Publish the release
    # Only reached when the image job succeeded, which means the attach step ran
    # and the attestation after it passed. Anything short of that leaves the
    # prerelease exactly as it is: the assets that did upload are still on it, and
    # /releases/latest is still the last version that has a whole image.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      REPO: ${{ github.repository }}
    steps:
      # The attach step in image.yml uploads these, but asking the release itself
      # is what proves the download works: an asset is only fetchable once GitHub
      # reports it "uploaded".
      - name: Check the download is there
        run: |
          set -euo pipefail
          uploaded="$(gh release view "$VERSION" --repo "$REPO" \
            --json assets --jq '.assets[] | select(.state == "uploaded") | .name')"
          missing=()
          # What the public pages point at: the asset docs/setup.html tells people
          # to click, and the Imager repository docs/troubleshooting.html publishes
          # as /releases/latest/download/pitchtribe-imager.json.
          for want in pitchtribe-rpi-arm64.img.xz pitchtribe-imager.json; do
            grep -qxF "$want" <<<"$uploaded" || missing+=("$want")
          done
          if (( ${#missing[@]} )); then
            echo "::error::$VERSION has no ${missing[*]} to download, so it stays a prerelease"
            exit 1
          fi

      - name: Make it the latest release
        # Unconditional: this workflow has already refused any version that is not
        # vX.Y.Z, so everything that gets here is a finished version. The rule for
        # which tags are finished versions lives once, in image.yml.
        run: |
          set -euo pipefail
          gh release edit "$VERSION" --repo "$REPO" --prerelease=false --latest
          echo "Published $VERSION — /releases/latest now answers it" >> "$GITHUB_STEP_SUMMARY"
