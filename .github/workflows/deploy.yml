name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  PAGES_PROJECT: pitchtribe-website

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (copy static root + compile Tailwind)
        run: npm run build

      - name: Verify build output
        run: |
          test -s dist/index.html
          test -s dist/_headers
          # The one-line installer the site tells people to pipe into a shell.
          # If this is missing, that published command 404s and silently does
          # nothing, so assert it is present and is the bootstrap script.
          test -s dist/install.sh
          grep -q 'deploy/install.sh' dist/install.sh
          bash -n dist/install.sh
          # Asset filenames are content-hashed, so assert by pattern and then
          # check that every asset the HTML actually references exists. That
          # catches a fingerprint/rewrite mismatch, which would otherwise ship
          # a page whose stylesheet 404s.
          ls dist/assets/app.*.css >/dev/null
          ls dist/assets/main.*.js >/dev/null
          missing=0
          # Translated pages: every language present, and every string translated.
          for l in fr es de it pt pl ru zh ja; do test -s dist/$l/index.html && test -s dist/$l/buy.html; done
          npm run i18n:check | tee /tmp/i18n.txt
          if grep -q "missing:" /tmp/i18n.txt; then echo "::warning::Some website strings are not translated yet (they show in English)"; fi
          for ref in $(grep -ohE '/assets/[A-Za-z0-9._-]+' dist/*.html dist/*/*.html | sort -u); do
            if [ ! -s "dist$ref" ]; then
              echo "::error::HTML references $ref but dist$ref is missing or empty"
              missing=1
            fi
          done
          test "$missing" -eq 0
          ls -lR dist

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-dist
          path: dist
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # Production deploys only from pushes / manual runs on main (PRs just build).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # A job only sees repository-level secrets plus secrets scoped to its own
    # environment. CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID currently live in the
    # `cloudflare_api` environment, so the job has to run there to read them.
    # If those secrets are ever moved to repository level, change this back to
    # `production` -- that is the better home for a deploy environment.
    environment:
      name: cloudflare_api
      url: ${{ steps.deploy.outputs.deployment-url }}
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-dist
          path: dist

      - name: Verify Cloudflare credentials are visible to this job
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CF_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Empty secret(s):$missing. A job reads only repository-level secrets plus secrets scoped to its own environment (currently '${{ github.job }}' runs in cloudflare_api). Check the secret exists in that scope."
            exit 1
          fi
          echo "Both Cloudflare credentials are present."

      - name: Deploy with Wrangler
        id: deploy
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=${{ env.PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }} --commit-dirty=true
