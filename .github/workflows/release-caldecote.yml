name: Release (Caldecote line)

# Publishes a release of the Caldecote club line, with its SD card image attached:
# Actions → Release (Caldecote line) → Run workflow, enter the version (e.g. 0.0.1).
#
# This exists because release.yml cannot do it. That workflow checks out `ref: main`
# and refuses any version that is not vX.Y.Z — by design, because it publishes the
# base system. A club line is a different thing on a different branch with its own
# numbering, so it gets its own button rather than a flag on that one.
#
# Two deliberate differences from release.yml:
#
#   - the tag is caldecote-X.Y.Z, not vX.Y.Z, so the two numbering schemes can never
#     collide and `git tag` reads as two lists rather than one muddle;
#   - the release is a PRERELEASE. The website's download button points at
#     /releases/latest, which skips prereleases — so publishing a club build must
#     never move the link a stranger clicks. This is not cosmetic.
#
# This file lives on main because GitHub only offers workflow_dispatch for workflows
# present on the default branch. It does nothing on main until somebody runs it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Club-line version to release, like 0.0.1 (tagged caldecote-0.0.1)
        required: true
      branch:
        description: Branch to release from
        default: caldecote
        required: false
      replace:
        description: Replace this release if it already exists (deletes its tag and files, then tags the branch again)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-caldecote-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the club line and create the release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      BRANCH: ${{ inputs.branch }}
      REPLACE: ${{ inputs.replace }}
    outputs:
      tag: ${{ steps.name.outputs.tag }}
    steps:
      - name: Name the tag
        id: name
        run: |
          set -euo pipefail
          # Accept 0.0.1 or caldecote-0.0.1; store one shape either way.
          v="${VERSION#caldecote-}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version must look like 0.0.1, not “$VERSION”"; exit 1; }
          [[ "$BRANCH" == caldecote* ]] || { echo "::error::This workflow releases the caldecote line, not “$BRANCH”"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=caldecote-$v" >> "$GITHUB_OUTPUT"

      - name: Checkout the club line
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Check the version against the line's own file
        env:
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          set -euo pipefail
          # caldecote/release.json is the club line's version of record. The base
          # system's app/package.json is deliberately NOT touched by this line, so
          # that a base release merging forward never conflicts with it.
          file_version="$(node -p 'require("./caldecote/release.json").version')"
          if [[ "$file_version" != "$VERSION" ]]; then
            echo "::error::caldecote/release.json says $file_version, but this release is $VERSION. Update the file on the branch first."
            exit 1
          fi
          echo "Base system under this line: $(node -p 'require("./caldecote/release.json").base')"

      - name: Remove the old release and tag
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          set -euo pipefail
          exists_release=0; exists_tag=0
          gh release view "$TAG" >/dev/null 2>&1 && exists_release=1
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1 && exists_tag=1
          if (( exists_release || exists_tag )); then
            if [[ "$REPLACE" != true ]]; then
              echo "::error::$TAG already exists. Run again with “replace” ticked to redo it from $BRANCH."
              exit 1
            fi
            (( exists_release )) && gh release delete "$TAG" --yes
            (( exists_tag )) && git push origin ":refs/tags/$TAG"
            echo "Removed the old $TAG"
          fi

      - name: Tag the branch and create the release
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -d "$TAG" >/dev/null 2>&1 || true
          git tag -a "$TAG" -m "PitchTribe — Caldecote line $TAG" "$(git rev-parse HEAD)"
          git push origin "refs/tags/$TAG"
          # --prerelease keeps /releases/latest — the website's download button — on
          # the base system. One club's build is not the public download.
          gh release create "$TAG" --verify-tag --prerelease \
            --title "PitchTribe — Caldecote $TAG" --generate-notes
          echo "Tagged $(git rev-parse --short HEAD) on $BRANCH as $TAG" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: SD card image
    needs: tag
    # These three mirror image.yml's own job permissions, and all three are needed.
    # A reusable workflow cannot be granted more than its caller holds, so if the
    # caller omits id-token/attestations the called workflow is refused them — and
    # because the signing step declares them at job level, GitHub rejects the whole
    # run at startup, before the tag job runs. That reads as "a workflow file issue"
    # with no log and no failed step, which is a bad half-hour; hence this comment.
    permissions:
      contents: write
      id-token: write     # provenance attestation for the released image
      attestations: write
    uses: ./.github/workflows/image.yml
    with:
      release_tag: ${{ needs.tag.outputs.tag }}
