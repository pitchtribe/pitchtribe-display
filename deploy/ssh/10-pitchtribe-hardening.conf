# PitchTribe SSH hardening. Installed by deploy/install.sh into
# /etc/ssh/sshd_config.d/, which Raspberry Pi OS includes from sshd_config.
#
# SSH is off on a fresh card. It is switched on from the dashboard, under
# Settings → Remote access, which creates the login and starts ssh.service
# (app/bin/remote-access.js).
#
# Two things are deliberately left as they are:
#
#   PasswordAuthentication — stays on. Remote access works by setting a
#   password for the login, so turning it off would lock out the only way in
#   that the product offers, on every club at once.
#
#   Port — stays 22. It is what the setup and troubleshooting docs tell people
#   to use, and moving it hides the service from the club rather than from a
#   scanner.
#
# Nobody logs in as root: the dashboard's helper refuses to touch "root" and
# creates a named account in the sudo group instead.
PermitRootLogin no

# An account with no password must never be a way in.
PermitEmptyPasswords no

# Slow down password guessing, and don't hold connections open while someone
# thinks about it.
MaxAuthTries 3
MaxSessions 4
LoginGraceTime 30s

# A screen in a bar has no use for these.
X11Forwarding no
AllowAgentForwarding no
PermitTunnel no

# Drop a session that has gone away, so a forgotten laptop doesn't keep a
# login open on the club's network.
ClientAliveInterval 300
ClientAliveCountMax 2
