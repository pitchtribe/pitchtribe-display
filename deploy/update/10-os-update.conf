# Drop-in for pitchtribe-backup@nightly.service only — deploy/install.sh puts
# this in /etc/systemd/system/pitchtribe-backup@nightly.service.d/.
#
# The nightly backup is the one moment every night when a club's Pi is already
# busy with housekeeping, so the OS updates go in front of it: one schedule to
# reason about (pitchtribe-backup.timer, 03:30, Persistent=true, so a Pi that
# was off catches up when it next starts), and the backup that follows is taken
# from a patched card rather than an unpatched one.
#
# Wants=, not Requires=: an update that fails, or a Pi that is offline, must
# never be the reason a club has no backup of its content.
[Unit]
Wants=pitchtribe-os-update.service
After=pitchtribe-os-update.service
